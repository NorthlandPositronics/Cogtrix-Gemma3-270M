name: CI – Quality & Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Validation jobs — run on PRs and manual triggers only.
  # ─────────────────────────────────────────────────────────────

  # 1. Code quality — Python syntax + Dockerfile lint
  quality:
    name: Code quality
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (Python)
        run: python -m compileall -q src/

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Dockerfile lint (llama.cpp)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.llamacpp
          failure-threshold: error

  # ─────────────────────────────────────────────────────────────
  # Publish jobs — run on tagged pushes (versioned releases).
  # ─────────────────────────────────────────────────────────────

  # 2. Publish per-arch fast-start images to GHCR
  publish:
    name: Publish (${{ matrix.arch }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Lowercase image name
        run: |
          REPO="${{ github.repository }}"
          echo "IMAGE_NAME=${REPO,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        run: |
          REF="${GITHUB_REF##*/}"
          # strip leading v if present for image tag, keep v-tag for manifest
          echo "IMAGE_TAG=${REF#v}" >> "$GITHUB_ENV"
          echo "REF_TAG=${REF}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.llamacpp
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.REF_TAG }}-${{ matrix.arch }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Publish multi-arch manifest
  publish-manifest:
    name: Publish manifest
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result != 'skipped' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Lowercase image name
        run: |
          REPO="${{ github.repository }}"
          echo "IMAGE_NAME=${REPO,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        run: |
          REF="${GITHUB_REF##*/}"
          echo "IMAGE_TAG=${REF#v}" >> "$GITHUB_ENV"
          echo "REF_TAG=${REF}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest
        run: |
          BASE="ghcr.io/${{ env.IMAGE_NAME }}"
          TAG="${{ env.IMAGE_TAG }}"
          docker buildx imagetools create \
            --tag "${BASE}:${TAG}" \
            --tag "${BASE}:${{ env.REF_TAG }}" \
            --tag "${BASE}:latest" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"

  # ─────────────────────────────────────────────────────────────
  # 4. CI summary (always runs)
  # ─────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, publish, publish-manifest]
    steps:
      - name: Post summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code quality (syntax, Dockerfile lint) | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish to GHCR | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish manifest | ${{ needs.publish-manifest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Toolchain:** py_compile · hadolint · GHCR" >> $GITHUB_STEP_SUMMARY
